name: desktop-linux
# A Linux build of the desktop app (.deb and AppImage), made on this fork alone.
#
# The upstream project builds the app for macOS and Windows only, and said so when it closed the Linux display-variable
# fix (#208): "the desktop app supports only macOS and Windows ... Linux support ... will come later". Nothing here is
# sent back by default: this workflow exists so that a build of this fork can be tried on Linux, where the CLI and
# Studio already run (`npx openfilm`).
#
# What it builds is a build of this source: product.json is empty in the repository, so the app never looks for updates.
# Run it by hand (Actions → desktop-linux → Run workflow) or on a push to main.
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/openfilm/**
      - packages/shared/**
      - .github/workflows/desktop-linux.yml
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/desktop-linux.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (linux-x64)
    # NOT ubuntu-latest: it is glibc 2.43, and a package built there needs that to start. This machine (deepin) is
    # glibc 2.38, so the runner is pinned below it: 22.04 is glibc 2.35, which starts on 2.38 and on 24.04 alike.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # electron-builder's .deb target runs dpkg and fakeroot; xvfb is the display the smoke test opens a window on
      - name: The tools a .deb is made with
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fakeroot dpkg rpm xvfb

      - run: pnpm install --frozen-lockfile

      - name: Build the .deb and the AppImage (--platform=linux --arch=x64)
        working-directory: apps/desktop
        env:
          # a Linux build is never signed, and nothing here notarizes: release.mjs skips both
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run release -- --platform=linux --arch=x64

      - name: The .deb names dependencies that resolve
        run: |
          DEB="$(ls apps/desktop/.release/linux-x64/out/*.deb)"
          echo "checking $DEB"
          dpkg-deb --info "$DEB" | sed -n '1,30p'
          # a .deb whose Depends cannot be installed fails on the person's machine, not here: make it fail here
          sudo dpkg -i "$DEB" || sudo apt-get -f install -y
          dpkg -s openfilm >/dev/null || { echo "::error::The .deb did not install"; exit 1; }

      # The point of the whole workflow. A package that installs is not a package that runs: this starts the installed
      # program on a display that has no monitor, and fails on the two ways a Linux build of a Mac/Windows app breaks
      # here — it cannot reach the display (environment.mjs LINUX_KEYS), or it needs a glibc this machine lacks.
      - name: The installed app opens its window
        run: |
          APP="$(command -v openfilm || true)"
          if [ -z "$APP" ]; then
            APP="$(find /opt -maxdepth 3 -name openfilm -type f -executable 2>/dev/null | head -1)"
          fi
          if [ -z "$APP" ]; then
            echo "::error::The installed app has no openfilm executable"
            dpkg -L openfilm | head -40
            exit 1
          fi
          echo "executable: $APP"
          # --no-sandbox: a runner has no user namespaces for Chromium's sandbox; this is a smoke test, not a release run
          STATUS=0
          timeout 60 xvfb-run -a --server-args="-screen 0 1280x800x24" \
            "$APP" --no-sandbox --disable-gpu > /tmp/app.log 2>&1 || STATUS=$?
          echo "--- exit status: $STATUS ---"
          tail -60 /tmp/app.log
          # a glibc or libstdc++ this build needs and this machine does not have: the exact failure a wrong runner causes
          if grep -qiE "GLIBC_[0-9]|CXXABI_[0-9]|GLIBCXX_[0-9]|version .GLIBC" /tmp/app.log; then
            echo "::error::The build needs a newer glibc/libstdc++ than this runner has; it would not start on deepin"
            grep -iE "GLIBC_[0-9]|CXXABI_[0-9]|GLIBCXX_[0-9]" /tmp/app.log | head -5
            exit 1
          fi
          if grep -qiE "Missing Xserver|cannot open display|no display|DISPLAY is not set" /tmp/app.log; then
            echo "::error::The app could not reach the display; environment.mjs LINUX_KEYS did not take effect"
            exit 1
          fi
          if [ "$STATUS" = "124" ]; then
            # still running when the 60 s ran out: the window opened and stayed up
            echo "The app ran until the 60 s timeout: the window opened."
            exit 0
          fi
          echo "::error::The app exited on its own with status $STATUS before the timeout"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/.release/linux-x64/out/*.deb
            apps/desktop/.release/linux-x64/out/*.AppImage
            apps/desktop/.release/linux-x64/out/latest*.yml
