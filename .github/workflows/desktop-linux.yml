name: desktop-linux
# A Linux build of the desktop app (.deb and AppImage), made on this fork alone.
#
# The upstream project builds the app for macOS and Windows only, and said so when it closed the Linux display-variable
# fix (#208): "the desktop app supports only macOS and Windows ... Linux support ... will come later". Nothing here is
# sent back by default: this workflow exists so that a build of this fork can be tried on Linux, where the CLI and
# Studio already run (`npx openfilm`).
#
# What it builds is a build of this source: product.json is empty in the repository, so the app never looks for updates.
# Run it by hand (Actions → desktop-linux → Run workflow) or on a push to main.
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/openfilm/**
      - packages/shared/**
      - .github/workflows/desktop-linux.yml
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/desktop-linux.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (linux-${{ matrix.arch }})
    # NOT ubuntu-latest: it is glibc 2.43, and a package built there needs that to start. This machine (deepin) is
    # glibc 2.38, so the runner is pinned below it: 22.04 is glibc 2.35, which starts on 2.38 and on 24.04 alike.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # x64 first: the deepin machine this was written for is x64
        include:
          - { arch: x64, out: linux-x64 }
          # arm64 is built on this same x64 runner: electron-builder fetches the arm64 Electron, no emulation needed
          - { arch: arm64, out: linux-arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # electron-builder's .deb target runs dpkg and fakeroot; both are here, but say so plainly
      - name: The tools a .deb is made with
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fakeroot dpkg rpm

      - run: pnpm install --frozen-lockfile

      - name: Build the .deb and the AppImage (--platform=linux --arch=${{ matrix.arch }})
        working-directory: apps/desktop
        env:
          # a Linux build is never signed, and nothing here notarizes: release.mjs skips both
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run release -- --platform=linux --arch=${{ matrix.arch }}

      # the app starts, and its window is drawn: the display fix (environment.mjs LINUX_KEYS) is what this proves.
      # Xvfb is a display with no monitor, which is all a runner has
      - name: The window opens under a virtual display
        if: matrix.arch == 'x64'
        run: |
          # 22.04 names the ALSA library libasound2 (24.04 renames it libasound2t64): try both
          sudo apt-get install -y -qq --no-install-recommends xvfb libnss3 libgbm1 libgtk-3-0 libasound2 || \
            sudo apt-get install -y -qq --no-install-recommends libasound2t64
          APP="$(find apps/desktop/.release/${{ matrix.out }}/out -maxdepth 2 -name 'openfilm' -type f -executable | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::No packaged openfilm executable found; the unpacked build is missing"
            find apps/desktop/.release/${{ matrix.out }}/out -maxdepth 3 | head -40
            exit 1
          fi
          echo "executable: $APP"
          # --no-sandbox: a runner has no user namespaces for Chromium's sandbox; this is a smoke test, not a release run
          STATUS=0
          timeout 60 xvfb-run -a --server-args="-screen 0 1280x800x24" \
            "$APP" --no-sandbox --disable-gpu > /tmp/app.log 2>&1 || STATUS=$?
          echo "--- exit status: $STATUS ---"
          tail -40 /tmp/app.log
          if [ "$STATUS" = "124" ]; then
            # still running when the 60 s ran out: the window opened and stayed up
            echo "The app ran until the 60 s timeout: the window opened."
          elif grep -qiE "Missing Xserver|cannot open display|no display" /tmp/app.log; then
            echo "::error::The app could not reach the display; environment.mjs LINUX_KEYS did not take effect"
            exit 1
          else
            echo "The app exited by itself with status $STATUS; see the log above."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.out }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/.release/${{ matrix.out }}/out/*.deb
            apps/desktop/.release/${{ matrix.out }}/out/*.AppImage
            apps/desktop/.release/${{ matrix.out }}/out/latest*.yml
