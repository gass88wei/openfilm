name: desktop-linux
# A Linux build of the desktop app (.deb and AppImage), made on this fork alone.
#
# The upstream project builds the app for macOS and Windows only, and said so when it closed the Linux display-variable
# fix (#208): "the desktop app supports only macOS and Windows ... Linux support ... will come later". Nothing here is
# sent back by default: this workflow exists so that a build of this fork can be tried on Linux, where the CLI and
# Studio already run (`npx openfilm`).
#
# What it builds is a build of this source: product.json is empty in the repository, so the app never looks for updates.
#
# Two ways in:
#   - a push to main (or Run workflow): build it, and prove it installs and opens a window. Nothing is published.
#   - pushing a tag v<version>: the same build, then a GitHub release named for the tag gets the .deb and the AppImage.
on:
  push:
    branches: [main]
    # a tag publishes. GitHub does not evaluate `paths` for tag pushes, so v* always runs this.
    tags: ['v*']
    paths:
      - apps/desktop/**
      - packages/openfilm/**
      - packages/shared/**
      - .github/workflows/desktop-linux.yml
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/desktop-linux.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (linux-x64)
    # NOT ubuntu-latest: it is glibc 2.43, and a package built there needs that to start. This machine (deepin) is
    # glibc 2.38, so the runner is pinned below it: 22.04 is glibc 2.35, which starts on 2.38 and on 24.04 alike.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Only what MAKES the package and starts it on a virtual display. The app's own runtime libraries
      # (libgtk-3-0, libnotify4, libnss3...) are not fetched on purpose: a runner is a headless server, not a
      # desktop, and downloading them became the only thing that ever failed this job (azure.archive.ubuntu.com
      # stopped resolving three times over). Whether a desktop has them is answered on the desktop, not here.
      - name: The tools that make and start the package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fakeroot dpkg rpm xvfb \
            || { echo "::warning::Some of these could not be fetched; the display step may fail"; }

      - run: pnpm install --frozen-lockfile

      - name: Build the .deb and the AppImage (--platform=linux --arch=x64)
        working-directory: apps/desktop
        env:
          # a Linux build is never signed, and nothing here notarizes: release.mjs skips both
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run release -- --platform=linux --arch=x64

      # What the package contains, read without installing anything: no dpkg database, no network. This is the part
      # that is really about the build — a missing .desktop entry, or a launcher pointing nowhere, is a real defect.
      - name: The package's contents are the ones a launcher needs
        run: |
          DEB="$(readlink -f "$(ls apps/desktop/.release/linux-x64/out/*.deb)")"
          echo "checking $DEB"
          dpkg-deb --info "$DEB" | sed -n '1,20p'
          echo "--- files ---"
          # the four paths the checks below read, one line each. head closes the pipe early and
          # dpkg-deb's tar complains about that on its way out; silenced — it means nothing.
          dpkg-deb --contents "$DEB" 2>/dev/null \
            | grep -E '\./opt/OpenFilm/openfilm$|applications/.*\.desktop$|icons/.*openfilm|resources/runtime/ms-playwright/$' | head -10
          # the executable sits at /opt/OpenFilm/openfilm — electron-builder puts it at
          # /opt/<productName>/<executableName>, which the .desktop's Exec line names — and
          # nothing is ever put in /usr/bin. Verified against the built 0.3.2 package itself.
          dpkg-deb --contents "$DEB" | grep -qE '\./opt/OpenFilm/openfilm$' \
            || { echo "::error::The package has no /opt/OpenFilm/openfilm executable"; exit 1; }
          dpkg-deb --contents "$DEB" | grep -qE 'applications/.*\.desktop$' \
            || { echo "::error::The package has no .desktop entry, so no launcher can find it"; exit 1; }
          dpkg-deb --contents "$DEB" | grep -qE 'resources/runtime/ms-playwright' \
            || { echo "::error::The bundle has no headless browser"; exit 1; }
          echo "contents ok"

      # The one thing that must be true: this build starts. Unpacked into a scratch folder rather than installed —
      # installing is what a desktop does, and needs a desktop. A window that stays up for 60 s on Xvfb proves the
      # display variables (environment.mjs LINUX_KEYS) reach Electron, and the binary was not built against a glibc
      # newer than this machine has.
      - name: The unpacked app opens its window
        run: |
          DEB="$(readlink -f "$(ls apps/desktop/.release/linux-x64/out/*.deb)")"
          OUT="$RUNNER_TEMP/app"
          mkdir -p "$OUT"
          dpkg-deb -x "$DEB" "$OUT"
          APP="$(find "$OUT" -type f -name openfilm -perm -u+x | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::The unpacked package has no openfilm executable"
            find "$OUT" -maxdepth 4 | head -40
            exit 1
          fi
          echo "executable: $APP"
          # --no-sandbox: a runner has no user namespaces for Chromium's sandbox; this is a smoke test, not a release run
          STATUS=0
          timeout 60 xvfb-run -a --server-args="-screen 0 1280x800x24" \
            "$APP" --no-sandbox --disable-gpu > /tmp/app.log 2>&1 || STATUS=$?
          echo "--- exit status: $STATUS ---"
          tail -60 /tmp/app.log
          # a glibc or libstdc++ newer than this machine has: the exact failure a wrong runner causes
          if grep -qiE "GLIBC_[0-9]|CXXABI_[0-9]|GLIBCXX_[0-9]|version .GLIBC" /tmp/app.log; then
            echo "::error::The build needs a newer glibc/libstdc++ than this runner has; it would not start on deepin"
            grep -iE "GLIBC_[0-9]|CXXABI_[0-9]|GLIBCXX_[0-9]" /tmp/app.log | head -5
            exit 1
          fi
          if grep -qiE "Missing Xserver|cannot open display|no display|DISPLAY is not set" /tmp/app.log; then
            echo "::error::The app could not reach the display; environment.mjs LINUX_KEYS did not take effect"
            exit 1
          fi
          # a missing shared library is a dependency gap: worth reporting, but a desktop has them, so it is not fatal
          if grep -qiE "error while loading shared libraries|cannot open shared object" /tmp/app.log; then
            echo "::warning::A shared library is missing on this runner; a desktop may still have it"
            grep -iE "error while loading shared libraries|cannot open shared object" /tmp/app.log | head -5
          fi
          if [ "$STATUS" = "124" ]; then
            echo "The app ran until the 60 s timeout: the window opened."
            exit 0
          fi
          echo "::error::The app exited on its own with status $STATUS before the timeout"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/.release/linux-x64/out/*.deb
            apps/desktop/.release/linux-x64/out/*.AppImage
            apps/desktop/.release/linux-x64/out/latest*.yml

  # Only a tag publishes. The build job above has already proved this exact build installs and opens a window, so
  # collecting the two artifacts is all that is left.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux-x64
          path: dist

      - name: The release notes (the changelog's entry for this version, else a line)
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          {
            echo "OpenFilm $VERSION for Linux (x86_64), built from this fork's source."
            echo
            echo "Install:"
            echo '```sh'
            echo "sudo apt-get install ./OpenFilm-${VERSION}-amd64-linux.deb"
            echo '```'
            echo
            echo "Or run the AppImage without installing it:"
            echo '```sh'
            echo "chmod +x OpenFilm-${VERSION}-x86_64-linux.AppImage && ./OpenFilm-${VERSION}-x86_64-linux.AppImage"
            echo '```'
            echo
            echo "Built on Ubuntu 22.04 (glibc 2.35), so it starts on Debian, Ubuntu, deepin and their derivatives."
            echo "Unsigned: no Linux signing key is used. It never looks for updates."
          } > notes.md
          echo "--- notes.md ---"
          cat notes.md

      - name: Create or update the release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # the tag was pushed again: replace the files, keep the release
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "OpenFilm $TAG for Linux" \
              --notes-file notes.md \
              --verify-tag
          fi
